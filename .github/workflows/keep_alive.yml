name: Wake Up Hugging Face Spaces

on:
  schedule:
    # Runs every 30 minutes to keep both Spaces active
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  wake-spaces:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Up n8n Space
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://huggingface.co/api/spaces/AliiiS/24-7_n8n/restart" \
            -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}")
          echo "n8n Space Response: $RESPONSE"

      - name: Wake Up PDF-to-Image API Space
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://huggingface.co/api/spaces/AliiiS/pdf-to-image-api/restart" \
            -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}")
          echo "PDF-to-Image API Response: $RESPONSE"

      - name: Wait 60s for containers to boot
        run: sleep 60

      - name: Ping Health Endpoints
        run: |
          curl -s -L "https://aliiis-24-7-n8n.hf.space/healthz" || true
          curl -s -L "https://aliis-pdf-to-image-api.hf.space" || true
